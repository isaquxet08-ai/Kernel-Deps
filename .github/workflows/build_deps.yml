name: Fetch and Release Debian Deps

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-deps:
    runs-on: ubuntu-22.04
    steps:
      - name: Download Debs
        run: |
          echo ">>> 正在下载官方规定的内核编译全量依赖..."
          mkdir -p debs && cd debs
          sudo apt-get update -qq
          
          # 从 AOSP 源码规范中提取的完整依赖列表
          apt-get download \
            build-essential \
            bc \
            bison \
            flex \
            libssl-dev \
            libelf-dev \
            libncurses5-dev \
            dwarves \
            zlib1g-dev \
            kmod \
            cpio \
            rsync \
            python3 \
            liblz4-tool \
            libxml2-utils
          
          echo ">>> 正在打包离线依赖..."
          tar -czvf ../kernel_deps.tar.gz *
          
          echo ">>> 检查下载结果："
          ls -lh | wc -l
          echo "个依赖包已下载"

      - name: Upload to Releases
        uses: softprops/action-gh-release@v1
        with:
          tag_name: deps-v1.0
          name: Kernel Dependencies v1.0
          files: kernel_deps.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
