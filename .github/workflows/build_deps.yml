name: Fetch and Release Full Debian Deps

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-deps:
    runs-on: ubuntu-22.04
    steps:
      - name: Download Full Dependency Tree
        run: |
          echo ">>> 正在解析并下载完整依赖树..."
          sudo apt-get update -qq
          
          # 核心魔法：--download-only 会把所有依赖及其底层依赖全部下载到缓存
          sudo apt-get install -y --download-only \
            build-essential \
            bc \
            bison \
            flex \
            libssl-dev \
            libelf-dev \
            libncurses5-dev \
            dwarves \
            zlib1g-dev \
            kmod \
            cpio \
            rsync \
            python3 \
            liblz4-tool \
            libxml2-utils

          echo ">>> 正在打包整个缓存目录..."
          mkdir -p offline_debs
          cp /var/cache/apt/archives/*.deb offline_debs/
          tar -czvf kernel_deps_full.tar.gz offline_debs/*
          
          echo ">>> 依赖包数量："
          ls -1 offline_debs | wc -l

      - name: Upload to Releases
        uses: softprops/action-gh-release@v1
        with:
          tag_name: deps-v2.0
          name: Full Kernel Dependencies v2.0
          files: kernel_deps_full.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
